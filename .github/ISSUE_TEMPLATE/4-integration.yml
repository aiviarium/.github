name: Integration
description: Support for an agent, tool, provider or service
type: Integration
labels: [needs triage]
body:
  - type: input
    id: tool
    attributes:
      label: Which agent, tool or service
      description: Its name and a link.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the project should do with it
      description: What it should install, set up or connect to, and what you do by hand today.
    validations:
      required: true
  - type: checkboxes
    id: work
    attributes:
      label: Who does it
      options:
        - label: I'd like to write this myself
        - label: I'd keep it working after it's merged
